name: Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 (Tahoe) runner image defaults to Xcode 26, which is what we want to build against.
    # See https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
    runs-on: macos-26
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 30
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@v4

      - name: Restore Swift packages cache
        uses: actions/cache/restore@v4
        id: packages-cache
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme BlueprintModels \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation | xcbeautify

      - name: Save Swift packages cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
